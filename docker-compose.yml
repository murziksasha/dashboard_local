services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard-local
    restart: unless-stopped
    ports:
      - "${PORT:-3003}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DASHBOARD_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

